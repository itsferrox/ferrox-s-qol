        :root {
            --mc-font-pixel: 'Press Start 2P', cursive, monospace;
            --mc-font-tall: 'VT323', monospace;
            
            --mc-text: #E0E0E0;
            --mc-text-shadow: #3F3F3F;
            --mc-text-hover: #FFFF55;
            --mc-text-hover-shadow: #3F3F00;
            
            --btn-bg: #747474;
            --btn-bg-hover: #6882E8;
            --btn-border-light: #A8A8A8;
            --btn-border-dark: #3B3B3B;
            --btn-border-black: #000000;
            
            --panel-bg: rgba(0, 0, 0, 0.78);
            --panel-border: #404040;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: var(--mc-font-pixel);
            color: var(--mc-text);
            background-color: #1a1a1a;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }

        /* Beta Minecraft Dirt Background Canvas */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            image-rendering: pixelated;
        }

        /* Dark Vignette Overlay */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.85) 100%);
            z-index: -1;
            pointer-events: none;
        }

        /* Authentic Minecraft Button */
        .mc-button {
            display: block;
            width: 100%;
            max-width: 400px;
            height: 44px;
            margin: 8px auto;
            background: #747474;
            border: 2px solid #000000;
            box-shadow: 
                inset 2px 2px 0px #A8A8A8, 
                inset -2px -2px 0px #3B3B3B;
            position: relative;
            cursor: pointer;
            text-align: center;
            line-height: 40px;
            font-family: var(--mc-font-pixel);
            font-size: 14px;
            color: #E0E0E0;
            text-shadow: 2px 2px 0px #3F3F3F;
            text-decoration: none;
            letter-spacing: 0.5px;
            transition: none;
        }

        .mc-button:hover {
            background-color: #6882E8;
            box-shadow: 
                inset 2px 2px 0px #9EAFFF, 
                inset -2px -2px 0px #2E3B7D;
            color: #FFFF55;
            text-shadow: 2px 2px 0px #3F3F00;
        }

        .mc-button:active {
            box-shadow: 
                inset -2px -2px 0px #A8A8A8, 
                inset 2px 2px 0px #3B3B3B;
        }

        .mc-button.half {
            width: 49%;
            display: inline-block;
            margin: 0;
        }
        
        .buttons-row {
            display: flex;
            justify-content: space-between;
            max-width: 400px;
            margin: 8px auto;
        }

        .view {
            display: none;
            width: 100%;
            min-height: 100vh;
            flex-direction: column;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .view.active {
            display: flex;
        }

        #main-menu {
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .logo-wrapper {
            position: relative;
            margin-bottom: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 580px;
            text-align: center;
        }

        /* Glowing Yellow Splash Text Positioned at Bottom Right of Title */
        .splash-text {
            position: absolute;
            bottom: 5px;
            right: 40px;
            transform: rotate(-15deg);
            animation: mcPulse 0.5s infinite alternate ease-in-out;
            font-family: var(--mc-font-pixel);
            font-size: 18px;
            color: #FFFF55;
            text-shadow: 3px 3px 0px #3F3F00, -1px -1px 0px #000, 1px -1px 0px #000, -1px 1px 0px #000, 1px 1px 0px #000;
            white-space: nowrap;
            z-index: 10;
            cursor: pointer;
        }

        .mc-search-input {
            width: 100%;
            max-width: 400px;
            margin: 12px auto 0 auto;
            display: block;
            padding: 8px 12px;
            background-color: #000000;
            border: 2px solid #555555;
            color: #FFFFFF;
            font-family: var(--mc-font-pixel);
            font-size: 12px;
            outline: none;
            box-shadow: inset 2px 2px 0 #222;
        }

        .mc-search-input:focus {
            border-color: #FFFF55;
        }

        @keyframes mcPulse {
            0% { transform: rotate(-15deg) scale(1); }
            100% { transform: rotate(-15deg) scale(1.08); }
        }

        .menu-buttons-container {
            width: 100%;
            max-width: 420px;
            padding: 0 10px;
        }

        .list-page {
            background-color: var(--panel-bg);
            border: 4px solid #282828;
            box-shadow: inset 0 0 10px #000000;
            margin: 30px auto;
            width: 92%;
            max-width: 1050px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 25px;
            max-height: 85vh;
        }

        .list-header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 3px dashed #555;
            padding-bottom: 12px;
        }

        .list-title {
            font-family: var(--mc-font-pixel);
            font-size: 22px;
            color: #FFFFFF;
            text-shadow: 3px 3px 0 #222;
        }

        .list-content {
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 12px;
        }
        
        .list-content::-webkit-scrollbar {
            width: 14px;
        }
        .list-content::-webkit-scrollbar-track {
            background: #000000; 
            border: 2px solid #333333;
        }
        .list-content::-webkit-scrollbar-thumb {
            background: #666666; 
            border: 2px solid #AAAAAA;
        }

        .category-title {
            font-family: var(--mc-font-pixel);
            font-size: 14px;
            color: #55FF55;
            text-shadow: 2px 2px 0 #003300;
            margin: 24px 0 12px 0;
            background: rgba(0, 50, 0, 0.4);
            padding: 8px 12px;
            border-left: 4px solid #55FF55;
        }

        .list-item {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            margin-bottom: 6px;
            padding: 10px 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .list-item:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #AAAAAA;
        }

        .item-number {
            font-family: var(--mc-font-tall);
            font-size: 24px;
            color: #888888;
            width: 50px;
            text-align: right;
            margin-right: 18px;
            flex-shrink: 0;
        }

        .item-details {

                padding: 15px;
                max-height: 90vh;

        let splashIndex = 0;

        function cycleSplash() {
            splashIndex = (splashIndex + 1) % splashes.length;
            document.getElementById('splash-text').innerText = splashes[splashIndex];
        }

        function initMinecraftBackground() {
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');
            
            function resize() {
                canvas.width = Math.max(1, Math.ceil(window.innerWidth / 4));
                canvas.height = Math.max(1, Math.ceil(window.innerHeight / 4));
                drawDirt();
            }

            function drawDirt() {
                const w = canvas.width;
                const h = canvas.height;
                if (w <= 0 || h <= 0) return;
                
                const imgData = ctx.createImageData(w, h);
                const data = imgData.data;

                for (let i = 0; i < data.length; i += 4) {
                    const rand = Math.random();
                    let r = 134, g = 96, b = 67; // #866043

                    if (rand < 0.2) {
                        r -= 15; g -= 12; b -= 10;
                    } else if (rand < 0.4) {
                        r -= 25; g -= 20; b -= 18;
                    } else if (rand > 0.85) {
                        r += 15; g += 12; b += 10;
                    }

                    data[i] = r;
                    data[i+1] = g;
                    data[i+2] = b;
                    data[i+3] = 255;
                }
                ctx.putImageData(imgData, 0, 0);
            }

            window.addEventListener('resize', resize);
            resize();
        }

        function navigate(viewId) {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');

        function createListItem(item, index) {
            return `
                <div class="list-item">
                    <div class="item-number">${index + 1}.</div>
                    <div class="item-details">
                        <div class="item-name">${item.name}</div>
                        <div class="item-desc">${item.desc}</div>
                    </div>
                </div>
            `;
        }

        function renderMods() {
            const container = document.getElementById('mods-content');
            const searchVal = (document.getElementById('mods-search')?.value || '').toLowerCase();
            let html = '';
            let globalIndex = 0;

            for (const [category, modsList] of Object.entries(categorizedMods)) {
                const filtered = modsList.filter(m => 
                    m.name.toLowerCase().includes(searchVal) || 
                    m.desc.toLowerCase().includes(searchVal)
                );

                if (filtered.length > 0) {
                    html += `<div class="category-title">${category}</div>`;
                    filtered.forEach(mod => {
                        html += createListItem(mod, globalIndex);
                        globalIndex++;
                    });
                }
            }

            if (html === '') {
                html = `<div style="text-align:center; padding: 20px; font-family: var(--mc-font-pixel); font-size: 12px; color: #888;">No mods found.</div>`;
            }

            container.innerHTML = html;
        }

        function filterList(type) {
            if (type === 'mods') {
                renderMods();
            } else if (type === 'resourcepacks') {
                const searchVal = (document.getElementById('resourcepacks-search')?.value || '').toLowerCase();
                const filtered = resourcepacks.filter(r => 
                    r.name.toLowerCase().includes(searchVal) || 
                    r.desc.toLowerCase().includes(searchVal)
                );
                renderSimpleList('resourcepacks-content', filtered);
            }
        }

        function renderSimpleList(elementId, dataArray) {
            const container = document.getElementById(elementId);
            let html = '';
            dataArray.forEach((item, index) => {
                html += createListItem(item, index);
            });
            if (dataArray.length === 0) {
                html = `<div style="text-align:center; padding: 20px; font-family: var(--mc-font-pixel); font-size: 12px; color: #888;">No items found.</div>`;
            }
            container.innerHTML = html;
        }

        window.onload = () => {
            initMinecraftBackground();
            renderMods();
            renderSimpleList('resourcepacks-content', resourcepacks);
            renderSimpleList('shaders-content', shaders);
            renderSimpleList('datapacks-content', datapacks);
        };
